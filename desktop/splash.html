<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLC Tag Monitor — Starting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background: #080c14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: 'Inter', sans-serif;
      color: #e8edf5;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-box {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #3b4fd4, #5b21b6);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-box svg {
      width: 26px;
      height: 26px;
      color: white;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .logo-sub {
      font-size: 12px;
      color: #576070;
      margin-top: 2px;
      font-weight: 400;
    }

    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 212, 255, 0.12);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status {
      font-size: 13px;
      color: #576070;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.3px;
      min-height: 20px;
      text-align: center;
    }

    .dots {
      display: flex;
      gap: 5px;
      margin-top: 4px;
    }

    .dots span {
      width: 5px;
      height: 5px;
      background: #00d4ff;
      border-radius: 50%;
      opacity: 0.3;
      animation: blink 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    .version {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 10px;
      color: #2a3040;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">PLC TAG MONITOR</div>
      <div class="logo-sub">Mitsubishi · MC Protocol · PostgreSQL</div>
    </div>
  </div>

  <div class="spinner-wrap">
    <div class="spinner"></div>
    <div id="status">Starting backend…</div>
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="version">v1.0.0</div>
</body>
</html>
